name: Build Official PPSSPP Android APK

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build APK from official PPSSPP source
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout official PPSSPP source
        uses: actions/checkout@v7
        with:
          repository: hrydgard/ppsspp
          ref: master
          fetch-depth: 0
          submodules: recursive
          path: source

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build normal debug APK
        working-directory: source
        run: ./gradlew assembleNormalDebug --stacktrace

      - name: Verify APK and create ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find source/android/build/outputs/apk -type f -name '*.apk' -print | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "Build completed but no APK file was found."
            exit 1
          fi
          mkdir -p dist
          for apk in "${apks[@]}"; do
            cp "$apk" dist/
          done
          (cd dist && zip -9 -q PPSSPP-Official-Android-APK.zip ./*.apk)
          sha256sum dist/*.apk dist/*.zip

      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v7
        with:
          name: PPSSPP-Official-Android-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
